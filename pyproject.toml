[project]
name = "ast-llm-benchmark"
version = "0.1.0"
description = "Benchmarking the Evaluators: AST vs. LLM-as-a-Judge"
requires-python = ">=3.11,<3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0,<2.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "groq>=0.4.0",
    "transformers>=4.38.0",
    "sentencepiece>=0.1.99,<1.0",
    "torch>=2.1.0,<3.0",
    "sentence-transformers>=2.6.0",
    "tabulate>=0.9.0",
    "streamlit>=1.28.0",
    # Makes requests/httpx (dataset + HuggingFace downloads) trust the OS certificate
    # store, needed behind corporate TLS-intercepting proxies.
    "pip-system-certs>=4.0; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[tool.uv]
package = false
